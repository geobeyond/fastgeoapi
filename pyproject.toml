[project]
name = "fastgeoapi"
version = "0.0.12"
description = "fastgeoapi"
authors = [{ name = "Francesco Bartoli", email = "francesco.bartoli@geobeyond.it" }]
maintainers = [{ name = "Youssef Harby", email = "youssef.harby@geobeyond.it" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    "mangum>=0.19,<1.0",
    "loguru>=0.7.3,<1.0",
    "fastapi-opa>=2.0.3,<3",
    "rasterio>=1.4.3,<2",
    "pygeoapi>=0.24,<0.25",
    "fastapi[standard]>=0.141,<1.0",
    "starlette>=1.3.1,<2.0", # direct dependency (middleware, ASGI types); fastapi sets no upper bound, this cap is the only guard
    "httpx>=0.28,<0.29", # direct dependency (JWKS fetch, AsyncHTTPClient protocol); arrived only via fastapi until now
    "httpx2>=2.12,<3", # direct dependency: the client FastMCP 4's OpenAPI provider expects
    "typer>=0.15.3,<0.28",
    "fastapi-key-auth>=0.15.4,<0.16.0",
    "sqlalchemy>=2.0.40,<2.1",
    "geoalchemy2>=0.18.1,<0.19",
    "shapely>=2.0,<3",
    "psycopg2-binary>=2.9.10,<3",
    "openapi-pydantic>=0.5.1,<=1.0",
    "pygeofilter>=0.4,<0.5",
    "pydantic-settings>=2.9.1,<3",
    "authlib>=1.7.2,<2",
    "cachetools>=7,<8",
    "fencer",
    "json-ref-dict>=0.7.2,<=1.0",
    "pyyaml>=6.0.2,<7",
    "scalar-fastapi>=1.4.3,<2",
    "fastmcp>=4.0.0b1,<5",
    # fastmcp's own dependency, declared here only to name a pre-release
    # explicitly: resolvers enable pre-releases per package named with
    # one, and without this the unlocked CI lane cannot see the b-series
    # of fastmcp-slim and resolution fails. Replaces the previous GLOBAL
    # `[tool.uv] prerelease = "allow"`, which was quietly pulling rc/alpha
    # versions of unrelated packages into the lock (wrapt, sentry-sdk).
    # Drop together with the beta specifiers once fastmcp 4.0 is stable.
    "fastmcp-slim[client]>=4.0.0b1,<5",
    "obstore>=0.11.1,<0.12",
]

[project.urls]
Homepage = "https://github.com/geobeyond/fastgeoapi"
Repository = "https://github.com/geobeyond/fastgeoapi"
Documentation = "https://geobeyond.github.io/fastgeoapi/"
Changelog = "https://github.com/geobeyond/fastgeoapi/releases"

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
fastgeoapi = "app.cli:app"

[project.optional-dependencies]
geoparquet = [
    "duckdb>=1.5,<2",
    # obstore ships `obstore.fsspec` but declares neither an `fsspec`
    # extra nor the dependency: `obstore[fsspec]` installs nothing.
    "fsspec>=2024.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    # Local S3 for the end-to-end test of the bucket read path. Kept in
    # `dev` and never near the `geoparquet` extra: it drags in botocore,
    # which is 15 MB the runtime has no use for.
    "ministack>=1.5,<2",
    "boto3>=1.35",
    "coverage[toml]>=7.13.1,<8",
    "typeguard>=4.0.0,<5",
    "xdoctest[colors]>=1.3,<1.4",
    "pre-commit>=4.0.0,<5",
    "ruff>=0.14.0",
    "pre-commit-hooks>=6,<7",
    "termynal>=0.13.0",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=8.0.0,<10",
    "mkdocs-material-extras>=0.0.11",
    "mkdocs-material-extensions>=1.3.1,<2",
    "mkdocs-swagger-ui-tag>=0.7",
    "mkdocstrings[python]>=1.0.0",
    "bandit>=1.9.2,<2",
    "ipython<9.12",
    "ty>=0.0.8",
    "commitizen>=4.11,<5",
    "openapi-resolver>=0.0.6,<0.0.7",
    "schemathesis>=4.0",
    "mkdocs-typer>=0.0.3,<0.0.4",
    "mkdocs-include-markdown-plugin>=7.0.0,<8",
    "pytest-asyncio>=1.3,<1.4",
    "nox[uv]>=2025.11.12",
    "pytest-iam>=0.2.0",
    "canaille[sqlite]>=0.0.74",
    # joserfc >= 1.7 rejects canaille's signing key ("Invalid key_op 'sign'
    # for public key") and 500s the test IdP token endpoint; pin until the
    # canaille/joserfc incompatibility is fixed upstream.
    "joserfc>=1.6,<1.7",
]

[tool.uv]

[tool.uv.sources]
fencer = { git = "https://github.com/abunuwas/fencer.git", branch = "main" }

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "app/**/*.py",
]

[tool.hatch.build.targets.wheel]
include = [
    "app",
    "app/**/*.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.paths]
source = [".", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["fastgeoapi", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# ty is still in alpha, ignoring some rules temporarily
# These are mostly false positives with pydantic-settings and Starlette
missing-argument = "ignore"       # pydantic-settings gets values from env vars
invalid-argument-type = "ignore"  # Starlette middleware type inference issues
unresolved-attribute = "ignore"   # Dynamic attribute access patterns
unknown-argument = "ignore"       # openapi-pydantic uses aliased fields (security_scheme_in -> in)

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    ".nox",
    "build",
    "dist",
]

[tool.ruff.lint]
preview = true
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "DOC",    # pydoclint (requires preview)
    "N",      # pep8-naming
    "RUF",    # ruff-specific rules
]
ignore = [
    "undocumented-public-module",   # Missing docstring in public module
    "undocumented-public-package",   # Missing docstring in public package
    "undocumented-public-init",   # Missing docstring in __init__
    "assert",   # Use of assert detected (needed for tests)
    "missing-trailing-period",   # First line should end with a period (tracked in #315)
    "non-imperative-mood",   # First line should be in imperative mood (tracked in #315)
    "docstring-starts-with-this",   # First word of docstring should not be "This" (tracked in #315)
    "docstring-missing-returns", # Return not documented in docstring (tracked in #315)
    "docstring-missing-yields", # Yield not documented in docstring (tracked in #315)
    "docstring-missing-exception", # Raised exception missing from docstring (tracked in #315)
    "mutable-class-default", # Mutable class attributes should use ClassVar (tracked in #315)
    "unused-async", # Async function without await (tracked in #315)
    "used-dummy-variable", # Local variable with leading underscore shadowing (tracked in #315)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# `hardcoded-sql-expression`: the GeoParquet tests build fixture datasets
# and probe queries with f-string SQL over literals and tmp paths — no
# request input is involved, and the provider's own SQL is reviewed at
# the source (see app/provider/geoparquet.py).
"tests/*" = ["assert", "hardcoded-bind-all-interfaces", "hardcoded-password-string", "hardcoded-password-func-arg", "hardcoded-temp-file", "hardcoded-sql-expression", "invalid-function-name", "D", "line-too-long"]
"app/pygeoapi/*" = ["D", "DOC"]  # Temporarily ignored, tracked in #315
# Mirrors upstream pygeoapi/api/__init__.py, where validate_datetime lives:
# the patch must sit in the same-named module, which upstream made a package init.
"app/pygeoapi/api/__init__.py" = ["non-empty-init-module"]
"noxfile.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path"]  # subprocess calls to git are safe

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    # passlib uses deprecated crypt module, will be fixed in future versions
    "ignore:'crypt' is deprecated:DeprecationWarning",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

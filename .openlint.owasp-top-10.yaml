# OWASP API Security Top 10 ruleset for the generated pygeoapi document.
#
# The ruleset is Stoplight's 2.0.1, vendored by scripts/vendor_owasp_ruleset.py
# with its Spectral imports pointed at OpenLint's packages. The version is
# pinned there, with its digest. A floating version once silenced the whole
# check: rules named here moved in a newer release
# (`owasp:api4:2023-define-cors-origin` to `api8`,
# `owasp:api4:2023-integer-limit` to `integer-limit-legacy`), the linter
# aborted with "Cannot extend non-existing rule" before validating anything,
# and the job reported a clean run it had never performed. Bump the pin
# deliberately, reading the changelog.
extends: ["./.openlint/owasp-ruleset.mjs"]

rules:
  # --- Noise from the OGC schemas we resolve, not from our contract -------
  #
  # OpenLint follows `$ref`s into schemas.opengis.net, and those documents
  # predate these rules. They are outside our control, and every one of
  # these findings sits in a remote file — verified, not assumed.
  owasp:api4:2023-string-limit: warn
  owasp:api4:2023-string-restricted: warn
  owasp:api4:2023-array-limit: warn
  owasp:api4:2023-integer-limit-legacy: warn
  owasp:api4:2023-integer-format: warn

  # --- Real, and ours, but not actionable here ----------------------------
  #
  # Rate limiting is a deployment concern (reverse proxy / platform), not a
  # property of the document. Keeping it as a warning records the gap
  # instead of pretending it does not exist.
  owasp:api4:2023-rate-limit: warn

  # CORS is configured in the application, not declared in the document, so
  # this rule cannot see the real setting. Tracked separately: the root app
  # currently allows every origin *with* credentials, which deserves its own
  # look rather than a linter annotation.
  owasp:api8:2023-define-cors-origin: warn

name: Container Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-push:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
      security-events: write # SARIF upload
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first: the vulnerability gate must run BEFORE the
      # image is published, so a failing scan never reaches the registry.
      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fastgeoapi:scan-target
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 5000:5000 \
            -e ENV_STATE=dev -e HOST=0.0.0.0 -e PORT=5000 \
            -e DEV_PYGEOAPI_BASEURL=http://localhost:5000 \
            -e DEV_PYGEOAPI_CONFIG=pygeoapi-config.yml \
            -e DEV_PYGEOAPI_OPENAPI=/tmp/pygeoapi-openapi.yml \
            -e DEV_FASTGEOAPI_CONTEXT=/geoapi \
            -e DEV_API_KEY_ENABLED=false \
            -e DEV_JWKS_ENABLED=false \
            -e DEV_OPA_ENABLED=false \
            -e DEV_FASTGEOAPI_WITH_MCP=false \
            fastgeoapi:scan-target
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::container did not become healthy"; docker logs smoke; exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/readyz
          curl -fsS "http://127.0.0.1:5000/geoapi/collections?f=json" >/dev/null
          echo "smoke test passed"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f smoke || true

      - name: Scan image for vulnerabilities (gate)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: fastgeoapi:scan-target
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1" # fail the build on fixable CRITICAL findings

      - name: Scan image (SARIF for code scanning)
        if: always()
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: fastgeoapi:scan-target
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Publishing only happens for main/tags, and only after the gate.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image (keyless)
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          echo "signed ${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

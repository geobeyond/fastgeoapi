name: Release

on:
  push:
    branches:
      - main
      - master
      - develop

# Nothing is granted by default, so a job added later starts from zero
# and has to say what it needs.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` pushes the tag and publishes the release notes;
      # `id-token: write` is what PyPI trusted publishing exchanges for a
      # token. Nothing here touches a package registry other than PyPI, so
      # `packages: write` was granted and never used.
      contents: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          version: "0.10.9"

      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
          UV_BREAK_SYSTEM_PACKAGES: 1
        run: |
          uv pip install pip==25.1.1
          uv pip install hatch tomli tomli-w --system --break-system-packages

      # Tag-if-missing semantics: the previous diff-based detection
      # (salsify/action-detect-and-tag-new-version) only tagged when the
      # version changed between HEAD^ and HEAD of a single push, so a bump
      # landing mid-batch (PR merge, history rewrite) was silently missed
      # forever — 0.0.9 sat unpublished while the job stayed green.
      # `git ls-remote` checks the remote, so no local tag fetch is needed.
      - name: Detect unreleased version
        id: check-version
        if: github.ref != 'refs/heads/develop'
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists — nothing to release."
          else
            echo "Tag v$version missing — will tag and publish."
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag new version
        if: steps.check-version.outputs.tag
        run: |
          set -euo pipefail
          git tag "${{ steps.check-version.outputs.tag }}"
          git push origin "${{ steps.check-version.outputs.tag }}"

      - name: Bump version for developmental release
        if: github.ref == 'refs/heads/develop'
        run: |
          current_version=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          IFS='.' read -r -a version_parts <<< "$current_version"
          new_patch=$((version_parts[2] + 1))
          new_version="${version_parts[0]}.${version_parts[1]}.$new_patch.dev.$(date +%s)"
          python -c "import tomli, tomli_w; data = tomli.load(open('pyproject.toml', 'rb')); data['project']['version'] = '$new_version'; tomli_w.dump(data, open('pyproject.toml', 'wb'))"
          echo "Publishing version: $new_version"

      - name: Set up Node
        if: steps.check-version.outputs.tag || github.ref == 'refs/heads/develop'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      # This job tags, publishes to PyPI and writes the release notes, so
      # it is the one place where a dependency should not arrive from a
      # cache another run filled, nor run code on install. The shared
      # setup-node cache is gone and the install runs no lifecycle
      # scripts; the build itself is a step of its own, which is where
      # the page is actually produced. Verified locally: the editor still
      # builds with `--ignore-scripts`.
      - name: Build the editor's page
        if: steps.check-version.outputs.tag || github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix frontend
          npm run build --prefix frontend

      - name: Build package
        if: steps.check-version.outputs.tag || github.ref == 'refs/heads/develop'
        run: |
          uv pip install build --system --break-system-packages
          python -m build

      # A wheel without the page still installs and still serves the API,
      # so nothing would fail — the editor would just answer 503 forever
      # and nobody would know why. Checked here rather than discovered
      # by whoever opens it.
      - name: Refuse to publish a wheel with no page in it
        if: steps.check-version.outputs.tag || github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          if ! python -m zipfile -l "$wheel" | grep -q "app/editor/static/index.html"; then
            echo "::error::$wheel carries no editor page — the frontend build did not run"
            exit 1
          fi
          echo "The page is in $wheel"

      - name: Publish package on PyPI
        if: steps.check-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish package on TestPyPI
        if: github.ref == 'refs/heads/develop'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
          print-hash: true

      - name: Publish the release notes
        if: github.ref != 'refs/heads/develop'
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

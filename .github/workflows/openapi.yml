name: Validate OpenAPI with OpenLint

on:
  - push
  - pull_request

# This workflow only reads the repository and lints a document. It
# declared nothing, so it ran on whatever the repository defaults grant.
permissions:
  contents: read

jobs:
  openlint-oas:
    name: Lint and validate OpenAPI document for pygeoapi configuration
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install pip==25.1.1
          pip --version

      - name: Install UV
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          version: "0.10.9"

      - name: Create OpenAPI with fastgeoapi CLI
        run: |
          uv pip install --system --break-system-packages -r pyproject.toml
          uv run fastgeoapi openapi
        env:
          UV_SYSTEM_PYTHON: 1
          UV_BREAK_SYSTEM_PACKAGES: 1
      # The CLI is pinned: a major range would run whatever 1.x is
      # published next.
      - name: Install OpenLint
        run: npm install -g openlint@1.0.0

      - name: Show OAS3 ruleset
        run: cat .openlint.oas3.yaml

      # Highlights the findings as annotations but does not fail the build.
      - name: Run OpenLint for OAS3
        continue-on-error: true
        run: |
          openlint lint pygeoapi-openapi.json \
            --ruleset .openlint.oas3.yaml \
            --format github-actions

  openlint-owasp:
    name: Validate OpenAPI document against OWASP Top 10 API security rules
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install pip==25.1.1
          pip --version

      - name: Install UV
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          version: "0.10.9"

      - name: Create OpenAPI with fastgeoapi CLI
        run: |
          uv pip install --system --break-system-packages -r pyproject.toml
          uv run fastgeoapi openapi
        env:
          UV_SYSTEM_PYTHON: 1
          UV_BREAK_SYSTEM_PACKAGES: 1
      # The ruleset is vendored and pinned by scripts/vendor_owasp_ruleset.py;
      # the CLI is pinned here for the same reason.
      - name: Install OpenLint
        run: npm install -g openlint@1.0.0

      - name: Show OWASP ruleset
        run: cat .openlint.owasp-top-10.yaml

      # `|| true` because openlint exits non-zero when it finds anything.
      # The gate below decides, and fails if this produced no usable
      # report, which is how a broken ruleset went unnoticed before.
      - name: Run OWASP ruleset
        run: |
          openlint lint pygeoapi-openapi.json \
            --ruleset .openlint.owasp-top-10.yaml \
            --format json > openlint-owasp.json || true

      - name: Report findings and gate on ours
        run: python3 .github/scripts/owasp_gate.py

name: Validate OpenAPI with Spectral

on:
  - push
  - pull_request

jobs:
  spectral-oas:
    name: Lint and validate OpenAPI document for pygeoapi configuration
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install pip==25.1.1
          pip --version

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          version: "0.10.9"

      - name: Create OpenAPI with fastgeoapi CLI
        run: |
          uv pip install --system --break-system-packages -r pyproject.toml
          uv run fastgeoapi openapi
        env:
          UV_SYSTEM_PYTHON: 1
          UV_BREAK_SYSTEM_PACKAGES: 1
      # Display the OAS3 ruleset (already in repo)
      - name: Show OAS3 ruleset
        run: |
          cat .spectral.oas3.yaml

      # Run Spectral for OAS3 - highlights errors but doesn't fail the build
      - name: Run Spectral for OAS3
        uses: stoplightio/spectral-action@latest
        continue-on-error: true
        with:
          file_glob: "pygeoapi-openapi.json"
          spectral_ruleset: ".spectral.oas3.yaml"

  spectral-owasp:
    name: Validate OpenAPI document against OWASP Top 10 API security rules
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - name: Check out the repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install pip==25.1.1
          pip --version

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          version: "0.10.9"

      - name: Create OpenAPI with fastgeoapi CLI
        run: |
          uv pip install --system --break-system-packages -r pyproject.toml
          uv run fastgeoapi openapi
        env:
          UV_SYSTEM_PYTHON: 1
          UV_BREAK_SYSTEM_PACKAGES: 1
      # The ruleset version is pinned inside .spectral.owasp-top.10.yaml;
      # the CLI is pinned here for the same reason.
      - name: Install Spectral CLI
        run: npm install -g @stoplight/spectral-cli@6

      - name: Show OWASP ruleset
        run: cat .spectral.owasp-top.10.yaml

      # `|| true` because spectral exits non-zero when it finds anything.
      # The gate below decides — and fails if this produced no usable
      # report, which is how a broken ruleset went unnoticed before.
      - name: Run OWASP ruleset
        run: |
          spectral lint pygeoapi-openapi.json \
            --ruleset .spectral.owasp-top.10.yaml \
            --format json > spectral-owasp.json || true

      - name: Report findings and gate on ours
        run: python3 .github/scripts/owasp_gate.py

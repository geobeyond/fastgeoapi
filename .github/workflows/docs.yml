# Simple workflow for deploying static content to GitHub Pages
name: Deploy documentation

on:
  push:
    branches:
      - master
      - main
      - develop
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  # pages: write
  # id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # `--group docs` explicitly: the documentation stack lives in its
      # own group so the test environments do not carry it, which also
      # means asking for it here, or `zensical` is simply not installed.
      - name: Install dependencies
        run: uv sync --all-extras --dev --group docs
      # `zensical build` has no `gh-deploy`, so the branch is published
      # explicitly. `--strict` turns every warning into a failure, which
      # is what catches a broken link before a reader does — the site
      # builds clean today, so it costs nothing to demand it stays so.
      - name: Build the site
        run: uv run zensical build --strict

      # Pinned to the commit v4 pointed at, not to the tag: this step
      # receives GITHUB_TOKEN and writes the gh-pages branch, and a tag
      # can be moved by whoever owns the action's repository.
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs_build/site
          publish_branch: gh-pages

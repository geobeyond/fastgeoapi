# Simple workflow for deploying static content to GitHub Pages
name: Deploy documentation

on:
  push:
    branches:
      - master
      - main
      - develop
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  # pages: write
  # id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      # `--group docs` explicitly: the documentation stack lives in its
      # own group so the test environments do not carry it, which also
      # means asking for it here, or `zensical` is simply not installed.
      - name: Install dependencies
        run: uv sync --all-extras --dev --group docs
      # `zensical build` has no `gh-deploy`, so the branch is published
      # explicitly. `--strict` turns every warning into a failure, which
      # is what catches a broken link before a reader does — the site
      # builds clean today, so it costs nothing to demand it stays so.
      - name: Build the site
        run: uv run zensical build --strict

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs_build/site
          publish_branch: gh-pages

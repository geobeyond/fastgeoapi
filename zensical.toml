# Zensical, in place of mkdocs.yml.
#
# Material for MkDocs went into maintenance mode in November 2025 and its
# authors now build Zensical, which reads the same content and most of
# the same settings. This file is the previous `mkdocs.yml` translated,
# with the navigation deliberately left as it was: the reorganisation is
# a separate change, so that anything the move breaks is visible on its
# own.

[project]
site_name = "fastgeoapi"
site_description = "OGC API server built on pygeoapi, with authentication, cloud-native providers and an MCP endpoint"
site_url = "https://geobeyond.github.io/fastgeoapi/"
repo_name = "geobeyond/fastgeoapi"
repo_url = "https://github.com/geobeyond/fastgeoapi"
# Turns every page into an invitation: a reader who spots a mistake gets
# an edit link straight into the file, which for an open project is the
# shortest path from reader to contributor.
edit_uri = "edit/develop/docs/"
docs_dir = "docs"
site_dir = "docs_build/site"
copyright = "© Copyright 2025 Geobeyond team."
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Serving" = [
    "operators/index.md",
    { "Tutorials" = [
      { "Getting started" = "operators/tutorials/getting-started.md" },
      { "Protecting pygeoapi" = "operators/tutorials/protecting-pygeoapi.md" },
    ] },
    { "How-to guides" = [
      "operators/how-to/index.md",
      { "Config from cloud storage" = "operators/how-to/cloud-config.md" },
      { "GeoParquet provider" = "operators/how-to/geoparquet.md" },
      { "Editing the configuration" = "operators/how-to/configuration-editor.md" },
      { "Enabling the MCP server" = "operators/how-to/enabling-mcp.md" },
    ] },
    { "Reference" = [
      { "Configuration" = "operators/reference/configuration.md" },
      { "Command line" = "operators/reference/cli.md" },
    ] },
    { "Explanation" = [
      { "Why fastgeoapi" = "operators/explanation/why-fastgeoapi.md" },
    ] },
  ] },
  { "Consuming" = [
    "consumers/index.md",
    { "Tutorials" = [
      { "Connecting an MCP client" = "consumers/tutorials/connecting-an-mcp-client.md" },
    ] },
    { "How-to guides" = [
      { "Verifying with the MCP Inspector" = "consumers/how-to/mcp-inspector.md" },
    ] },
    { "Reference" = [
      { "OpenAPI" = "consumers/reference/openapi.md" },
      { "MCP specifications" = "consumers/reference/mcp-specifications.md" },
    ] },
    { "Explanation" = [
      { "The MCP server" = "consumers/explanation/mcp-server.md" },
    ] },
  ] },
  { "Contributing" = [
    "contributors/index.md",
    { "How-to guides" = [
      { "Development setup" = "contributors/how-to/development-setup.md" },
      { "Running the tests" = "contributors/how-to/running-the-tests.md" },
    ] },
    { "Reference" = [
      { "API reference" = "contributors/reference/index.md" },
    ] },
    { "Explanation" = [
      { "How it is put together" = "contributors/explanation/architecture.md" },
    ] },
  ] },
]

[project.theme]
# `modern` — the default — keeps the header light, and that is not just
# taste here: the mark is a sketch with white fills and black outlines,
# so it needs a light ground. `classic` paints the header with the
# primary colour, and the logo came apart on it. The colour goes where
# the modern variant actually uses it: links, accents, the active tab.
# The trimmed artwork. The original carries roughly 40% transparent air
# and a grey field baked in, which in a header reads as a box around the
# mark rather than as the mark.
# The horizontal lockup, which carries the wordmark with it — so the
# theme's own `site_name` text is hidden in extra.css, or the name reads
# twice in the same bar.
#
# The traced SVG: the same drawing as the PNG it replaces, hatching and
# all, with its colours named by role so the dark scheme is a
# substitution rather than a second drawing.
logo = "images/lockup-horizontal.svg"
# The deliberate reduction, not a smaller copy: the traced symbol's
# hatching collapses into grey mush at 32px. It came as its own file
# because that was asked for as a separate thing.
favicon = "images/favicon-32.png"
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.indexes",
  # Where you are, in a tree three branches wide and four quadrants deep.
  "navigation.path",
  # Where to go next, so a page ends in a door rather than a wall.
  "navigation.footer",
  # Pages are swapped without a full reload, and hovered links are
  # fetched ahead. Anything that ran on `window.onload` has to move to
  # `document$` — see the OpenAPI page, which mounts Swagger UI.
  "navigation.instant",
  "navigation.instant.prefetch",
  "toc.integrate",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.tabs.link",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  # Edit and view links, fed by `edit_uri` above.
  "content.action.edit",
  "content.action.view",
  # Abbreviations explain themselves on hover — these docs are thick with
  # OGC, MCP, OAuth, CQL2 and friends.
  "content.tooltips",
]

# Not the default Roboto, which reads as no choice at all — but not a
# display face either: the wordmark is Caveat and the symbol is a sketch,
# and a loud face beside them would be two voices talking over each
# other. Plex has enough character to look chosen, and its sans and mono
# were drawn as one family, so prose and code blocks agree rather than
# merely coexist.
[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
# `custom` means the theme defines nothing and extra.css defines it all —
# the accent is the mark's own blue rather than one of the theme's.
accent = "custom"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to Dark Mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to Light Mode"

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/geobeyond"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/geobeyond"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/fastgeoapi/"

# The API reference for contributors. Preliminary in Zensical — backlinks
# are not supported yet, and its authors say they will rethink API
# documentation from the ground up — so it is kept to what we rely on.
[project.plugins.mkdocstrings.handlers.python]
paths = ["app"]
# So a type in a signature links to where it is defined instead of being
# dead text.
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://fastapi.tiangolo.com/objects.inv",
]
options.docstring_style = "numpy"
options.show_source = true
options.show_root_heading = true
options.show_symbol_type_heading = true
options.show_symbol_type_toc = true
options.members_order = "source"

# Zensical's defaults, mirrored, plus our three additions.
#
# Declaring `markdown_extensions` **replaces** the defaults rather than
# extending them — so the migration silently dropped eleven of them,
# including `toc` with permalinks. That one is not cosmetic: without it
# no heading has an anchor, and nobody can link to a section of these
# docs. `content.tabs.link` was declared in the theme with no
# `pymdownx.tabbed` behind it to do anything.
#
# Keep in sync with Zensical's DEFAULT_MARKDOWN_EXTENSIONS on upgrades.

# --- Zensical's defaults ---------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.betterem"]
[project.markdown_extensions."pymdownx.caret"]
[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.keys"]
[project.markdown_extensions."pymdownx.magiclink"]
[project.markdown_extensions."pymdownx.mark"]
[project.markdown_extensions."pymdownx.smartsymbols"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions."pymdownx.tilde"]

# --- ours ------------------------------------------------------------
[project.markdown_extensions.tables]

[project.markdown_extensions."pymdownx.snippets"]
# So the home page can write the lockup into the page rather than link
# it: an SVG in an `<img>` never sees the page's custom properties, and
# the dark variant is exactly those properties. `check_paths` turns a
# missing include into a build failure rather than a silent blank.
base_path = ["docs"]
check_paths = true

[project.markdown_extensions.termynal]
include_assets = true
prompt_literal_start = ["$"]

[project.plugins.minify]
minify_html = true
minify_css = true
minify_js = true

[project.plugins.redirects.redirect_maps]
"cli.md" = "operators/reference/cli.md"
"cloud-config.md" = "operators/how-to/cloud-config.md"
"configuration-editor.md" = "operators/how-to/configuration-editor.md"
# Disabled long before this reorganisation, by renaming it to .tmp.
# The branch is where it would live now.
"contributing.md" = "contributors/index.md"
"geoparquet.md" = "operators/how-to/geoparquet.md"
"getting-started.md" = "operators/tutorials/getting-started.md"
"howto-guides.md" = "operators/how-to/index.md"
"mcp-server.md" = "consumers/index.md"
"mcp/configuration.md" = "operators/how-to/enabling-mcp.md"
"mcp/getting-started.md" = "consumers/tutorials/connecting-an-mcp-client.md"
"mcp/index.md" = "consumers/index.md"
"mcp/inspector.md" = "consumers/how-to/mcp-inspector.md"
"mcp/specifications.md" = "consumers/reference/mcp-specifications.md"
"openapi.md" = "consumers/reference/openapi.md"
"tutorials.md" = "operators/tutorials/protecting-pygeoapi.md"
"why-fastgeoapi.md" = "operators/explanation/why-fastgeoapi.md"

# The configuration the public demo serves, and the one this repository keeps.
#
# This file and `s3://fastgeoapi-demo/pygeoapi-config.demo.yml` are the same
# document, under the same name on purpose: the deployment reads the object,
# `.flyio.env` names it, and this copy is where it gets a history, a review
# and a way back. Change it here, upload it there, call the reload webhook —
# or do the whole thing from `fastgeoapi config edit --source
# s3://fastgeoapi-demo/pygeoapi-config.demo.yml`, which is the only way to
# write it that does not need a shell.
#
# You can run it. Every dataset below is readable without credentials —
# Overture Maps' own public releases, and our two extracts on Tigris, opened
# for reading so that what the demo shows can be reproduced rather than taken
# on trust:
#
#     pip install 'fastgeoapi[geoparquet,pmtiles]'
#     PYGEOAPI_CONFIG=pygeoapi-config.demo.yml fastgeoapi run
#
# `pygeoapi-config.yml` beside this one is a different thing and stays as it
# is: upstream's own default, what a plain `pip install fastgeoapi` starts
# with and what the published image carries, so it may only name providers an
# installation without extras can construct.
#
# **A demo is not a deployment.** Reading this document tells you nothing you
# should not know — it holds no credentials, and every provider takes its keys
# from the environment. In production keep it private anyway: a configuration
# names the buckets it reads, and those may hold data you mean to offer only
# through the API, as OGC API - Features and Tiles, rather than as files.
#
# Two costs worth knowing before you start it. The GeoParquet provider reads
# the dataset's schema **when it is constructed** — at boot, on every reload
# and on every dry run — which against the Overture places release from Europe
# measured 87 s; in the same region it is a fraction of that, and staging a
# regional extract is the documented cure. The PMTiles provider costs nothing
# to construct and reads on the first request instead.
#
# The four collections are two pairs, on purpose: the same shapes read where
# Overture publishes them in us-west-2, and staged in a bucket beside the
# server. That pair is how the cost of locality is measured rather than
# argued — see docs/operators/explanation/why-fastgeoapi.md.

server:
  bind:
    host: ${HOST}
    port: ${PORT}
  url: ${PYGEOAPI_BASEURL}${FASTGEOAPI_CONTEXT}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
    - en-US
    - fr-CA
  pretty_print: true
  limits:
    default_items: 20
    max_items: 50
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  # Without a manager pygeoapi falls back to one whose `is_async` is
  # false, and then it leaves `/jobs`, `/jobs/{jobId}` and
  # `/jobs/{jobId}/results` out of the OpenAPI document — although the
  # routes are served either way, and OGC API - Processes Part 1 makes
  # them unconditional (Requirement 35: "The server SHALL support the
  # HTTP GET operation at the path /jobs/{jobID}"). The consequence is
  # not only a document that understates the server: the MCP tools are
  # generated from that document, so an agent could start an execution
  # and then had no way to ask how it went. TinyDB keeps its own file
  # lock, and this deployment runs a single worker anyway.
  manager:
    name: TinyDB
    connection: /tmp/pygeoapi-process-manager.db
    output_dir: /tmp/
logging:
  level: ERROR
metadata:
  identification:
    title:
      en: fastgeoapi demo
      fr: démonstration fastgeoapi
    description:
      en: pygeoapi provides an API to geospatial data
      fr: pygeoapi fournit une API aux données géospatiales
    keywords:
      en:
        - geospatial
        - data
        - api
      fr:
        - géospatiale
        - données
        - api
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://example.org
  license:
    name: CC-BY 4.0 license
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Organization Name
    url: https://pygeoapi.io
  contact:
    name: Lastname, Firstname
    position: Position Title
    address: Mailing Address
    city: City
    stateorprovince: Administrative Area
    postalcode: Zip or Postal Code
    country: Country
    phone: +xx-xxx-xxx-xxxx
    fax: +xx-xxx-xxx-xxxx
    email: you@example.org
    url: Contact URL
    hours: Mo-Fr 08:00-17:00
    instructions: During hours of service. Off on weekends.
    role: pointOfContact
resources:
  obs:
    type: collection
    title: Observations
    description: My cool observations
    keywords:
      - observations
      - monitoring
    context:
      - datetime: https://schema.org/DateTime
      - vocab: https://example.com/vocab#
        stn_id: vocab:stn_id
        value: vocab:value
    links:
      - type: text/csv
        rel: canonical
        title: data
        href: https://github.com/mapserver/mapserver/blob/branch-7-0/msautotest/wxs/data/obs.csv
        hreflang: en-US
      - type: text/csv
        rel: alternate
        title: data
        href: https://raw.githubusercontent.com/mapserver/mapserver/branch-7-0/msautotest/wxs/data/obs.csv
        hreflang: en-US
    extents:
      spatial:
        bbox:
          - -180
          - -90
          - 180
          - 90
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
      temporal:
        begin: 2000-10-30 18:24:39+00:00
        end: 2007-10-30 08:57:29+00:00
    providers:
      - type: feature
        name: CSV
        data: tests/data/obs.csv
        id_field: id
        geometry:
          x_field: long
          y_field: lat
  lakes:
    type: collection
    title:
      en: Large Lakes
      fr: Grands Lacs
    description:
      en: lakes of the world, public domain
      fr: lacs du monde, domaine public
    keywords:
      en:
        - lakes
        - water bodies
      fr:
        - lacs
        - plans d'eau
    links:
      - type: text/html
        rel: canonical
        title: information
        href: http://www.naturalearthdata.com/
        hreflang: en-US
    extents:
      spatial:
        bbox:
          - -180
          - -90
          - 180
          - 90
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
      temporal:
        begin: 2011-11-11 11:11:11+00:00
        end: null
    providers:
      - type: feature
        name: GeoJSON
        data: tests/data/ne_110m_lakes.geojson
        id_field: id
        title_field: name
  hello-world:
    type: process
    processor:
      name: HelloWorld
  overture-places:
    type: collection
    title: Overture places
    description:
      Points of interest read straight from the Overture Maps release on S3, with
      no copy held by this server
    keywords:
      - overture
      - places
      - points of interest
    links:
      - type: text/html
        rel: canonical
        title: Overture Maps Foundation
        href: https://overturemaps.org/
        hreflang: en-US
    extents:
      spatial:
        bbox:
          - -180
          - -90
          - 180
          - 90
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: app.provider.geoparquet.GeoParquetProvider
        data: s3://overturemaps-us-west-2/release/2026-08-19.0/theme=places/type=place/
        id_field: id
        geometry_column: geometry
        count: false
        properties:
          - names
          - categories
          - confidence
          - operating_status
          - basic_category
        store_options:
          region: us-west-2
          skip_signature: true
        engine_options:
          memory_limit: 384MB
          threads: 2
  lazio-roads:
    type: collection
    title: Lazio roads (Overture segments)
    description:
      Overture transportation segments for Lazio, staged as GeoParquet in the same
      region as this deployment — covering bbox and Hilbert ordering
    keywords:
      - overture
      - transportation
      - roads
      - lazio
    links:
      - type: text/html
        rel: canonical
        title: Overture Maps Foundation
        href: https://overturemaps.org/
        hreflang: en-US
    extents:
      spatial:
        bbox:
          - 11.4
          - 41.2
          - 14.1
          - 42.9
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: app.provider.geoparquet.GeoParquetProvider
        data: s3://fastgeoapi-demo/overture/transportation-lazio.parquet
        id_field: id
        geometry_column: geometry
        title_field: name
        store_options:
          endpoint: fly.storage.tigris.dev
          region: auto
          # Tigris serves a public object on the bucket's own hostname and
          # refuses the path form, so the address is built the virtual-hosted
          # way. The bucket goes into the host, and which side puts it there
          # differs between the two readers — the storage layer reconciles
          # that, so this stays in DuckDB's vocabulary like every other key.
          url_style: vhost
          # These two objects are public, so the reads are unsigned: the
          # document then needs no credentials at all, and a reader can run
          # it. Without this the store looks for keys it will not find and
          # spends twenty seconds asking an EC2 metadata endpoint.
          skip_signature: true
        engine_options:
          memory_limit: 384MB
          threads: 2
  overture-places-tiles:
    type: collection
    title: Overture places as vector tiles (z14)
    description:
      The same Overture Maps places release, served as Mapbox vector tiles read
      by byte range from the PMTiles archive on S3; the archive only holds zoom level 14
    keywords:
      - overture
      - places
      - pmtiles
      - vector tiles
    links:
      - type: text/html
        rel: canonical
        title: Overture Maps tiles
        href: https://docs.overturemaps.org/examples/overture-tiles/
        hreflang: en-US
    extents:
      spatial:
        # A city rather than the world, deliberately: pygeoapi's tile viewer
        # fits its map to this box and never asks below `minzoom`, and this
        # archive holds zoom 14 only — a global box opens on an empty map.
        bbox:
          - 12.47
          - 41.885
          - 12.51
          - 41.905
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: tile
        name: app.provider.pmtiles.PMTilesProvider
        data: s3://overturemaps-extras-us-west-2/tiles/2026-08-19.0/places.pmtiles
        store_options:
          endpoint: s3.us-west-2.amazonaws.com
          region: us-west-2
          skip_signature: true
        options:
          zoom:
            min: 14
            max: 14
          schemes:
            - WebMercatorQuad
        format:
          name: pbf
          mimetype: application/vnd.mapbox-vector-tile
  lazio-roads-tiles:
    type: collection
    title: Lazio roads as vector tiles
    description:
      The Lazio road segments of the lazio-roads collection, tiled with tippecanoe
      into a PMTiles archive kept on Tigris in the same region as this deployment, and read
      by byte range
    keywords:
      - overture
      - transportation
      - roads
      - lazio
      - pmtiles
      - vector tiles
    links:
      - type: text/html
        rel: canonical
        title: Overture Maps Foundation
        href: https://overturemaps.org/
        hreflang: en-US
    extents:
      spatial:
        bbox:
          - 11.4
          - 41.2
          - 14.1
          - 42.9
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: tile
        name: app.provider.pmtiles.PMTilesProvider
        data: s3://fastgeoapi-demo/tiles/lazio-roads.pmtiles
        store_options:
          endpoint: fly.storage.tigris.dev
          region: auto
          # Tigris serves a public object on the bucket's own hostname and
          # refuses the path form, so the address is built the virtual-hosted
          # way. The bucket goes into the host, and which side puts it there
          # differs between the two readers — the storage layer reconciles
          # that, so this stays in DuckDB's vocabulary like every other key.
          url_style: vhost
          # These two objects are public, so the reads are unsigned: the
          # document then needs no credentials at all, and a reader can run
          # it. Without this the store looks for keys it will not find and
          # spends twenty seconds asking an EC2 metadata endpoint.
          skip_signature: true
        options:
          zoom:
            min: 0
            max: 13
          schemes:
            - WebMercatorQuad
        format:
          name: pbf
          mimetype: application/vnd.mapbox-vector-tile

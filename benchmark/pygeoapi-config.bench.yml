# Benchmark-only pygeoapi config: see benchmark/README.md.
# lazio-roads (GeoParquet) feeds the martin-wrapper and standalone martin,
# lazio-roads-tiles (PMTiles of the same segments) feeds pygeoapi's own tile path.

server:
  bind:
    host: ${HOST}
    port: ${PORT}
  url: ${PYGEOAPI_BASEURL}${FASTGEOAPI_CONTEXT}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
    - en-US
    - fr-CA
  pretty_print: true
  limits:
    default_items: 20
    max_items: 50
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  # Without a manager pygeoapi falls back to one whose `is_async` is
  # false, and then it leaves `/jobs`, `/jobs/{jobId}` and
  # `/jobs/{jobId}/results` out of the OpenAPI document — although the
  # routes are served either way, and OGC API - Processes Part 1 makes
  # them unconditional (Requirement 35: "The server SHALL support the
  # HTTP GET operation at the path /jobs/{jobID}"). The consequence is
  # not only a document that understates the server: the MCP tools are
  # generated from that document, so an agent could start an execution
  # and then had no way to ask how it went. TinyDB keeps its own file
  # lock, and this deployment runs a single worker anyway.
  manager:
    name: TinyDB
    connection: /tmp/pygeoapi-process-manager.db
    output_dir: /tmp/
logging:
  level: ERROR
metadata:
  identification:
    title:
      en: fastgeoapi demo
      fr: démonstration fastgeoapi
    description:
      en: pygeoapi provides an API to geospatial data
      fr: pygeoapi fournit une API aux données géospatiales
    keywords:
      en:
        - geospatial
        - data
        - api
      fr:
        - géospatiale
        - données
        - api
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://example.org
  license:
    name: CC-BY 4.0 license
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Organization Name
    url: https://pygeoapi.io
  contact:
    name: Lastname, Firstname
    position: Position Title
    address: Mailing Address
    city: City
    stateorprovince: Administrative Area
    postalcode: Zip or Postal Code
    country: Country
    phone: +xx-xxx-xxx-xxxx
    fax: +xx-xxx-xxx-xxxx
    email: you@example.org
    url: Contact URL
    hours: Mo-Fr 08:00-17:00
    instructions: During hours of service. Off on weekends.
    role: pointOfContact
resources:
  lazio-roads:
    type: collection
    title: Lazio roads (Overture segments)
    description:
      Overture transportation segments for Lazio, staged as GeoParquet in the same
      region as this deployment — covering bbox and Hilbert ordering
    keywords:
      - overture
      - transportation
      - roads
      - lazio
    links:
      - type: text/html
        rel: canonical
        title: Overture Maps Foundation
        href: https://overturemaps.org/
        hreflang: en-US
    extents:
      spatial:
        bbox:
          - 11.4
          - 41.2
          - 14.1
          - 42.9
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: app.provider.geoparquet.GeoParquetProvider
        data: s3://fastgeoapi-demo/overture/transportation-lazio.parquet
        # data: https://fastgeoapi.fly.dev/geoapi/collections/lazio-roads-tiles
        id_field: id
        geometry_column: geometry
        title_field: name
        store_options:
          # endpoint: fly.storage.tigris.dev
          endpoint: t3.storage.dev
          region: auto
          # Tigris serves a public object on the bucket's own hostname and
          # refuses the path form, so the address is built the virtual-hosted
          # way. The bucket goes into the host, and which side puts it there
          # differs between the two readers — the storage layer reconciles
          # that, so this stays in DuckDB's vocabulary like every other key.
          url_style: vhost
          # These two objects are public, so the reads are unsigned: the
          # document then needs no credentials at all, and a reader can run
          # it. Without this the store looks for keys it will not find and
          # spends twenty seconds asking an EC2 metadata endpoint.
          skip_signature: true
          scope: s3://fastgeoapi-demo
        engine_options:
          memory_limit: 384MB
          threads: 2

  lazio-roads-tiles:
    type: collection
    title: Lazio roads as vector tiles
    description:
      The Lazio road segments of the lazio-roads collection, tiled with tippecanoe
      into a PMTiles archive kept on Tigris in the same region as this deployment, and read
      by byte range
    keywords:
      - overture
      - transportation
      - roads
      - lazio
      - pmtiles
      - vector tiles
    links:
      - type: text/html
        rel: canonical
        title: Overture Maps Foundation
        href: https://overturemaps.org/
        hreflang: en-US
    extents:
      spatial:
        bbox:
          - 11.4
          - 41.2
          - 14.1
          - 42.9
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: tile
        name: app.provider.pmtiles.PMTilesProvider
        data: s3://fastgeoapi-demo/tiles/lazio-roads.pmtiles
        store_options:
          endpoint: t3.storage.dev
          region: auto
          # Tigris serves a public object on the bucket's own hostname and
          # refuses the path form, so the address is built the virtual-hosted
          # way. The bucket goes into the host, and which side puts it there
          # differs between the two readers — the storage layer reconciles
          # that, so this stays in DuckDB's vocabulary like every other key.
          url_style: vhost
          # These two objects are public, so the reads are unsigned: the
          # document then needs no credentials at all, and a reader can run
          # it. Without this the store looks for keys it will not find and
          # spends twenty seconds asking an EC2 metadata endpoint.
          skip_signature: true
        options:
          zoom:
            min: 0
            max: 13
          schemes:
            - WebMercatorQuad
        format:
          name: pbf
          mimetype: application/vnd.mapbox-vector-tile

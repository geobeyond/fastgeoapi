repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # The generated configuration models are machine-produced; letting
      # a formatter rewrite them makes `nox -s models-check` fail, because
      # regenerating would no longer reproduce the committed file.
      - id: ruff-check
        args: [--fix]
        exclude: '^app/pygeoapi/config_models/(_generated\.py|pygeoapi-config-schema\.yml)$'
      - id: ruff-format
        exclude: '^app/pygeoapi/config_models/(_generated\.py|pygeoapi-config-schema\.yml)$'
  - repo: local
    hooks:
      - id: check-added-large-files
        name: Check for added large files
        entry: check-added-large-files
        language: system
      - id: check-toml
        name: Check Toml
        entry: check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: Check Yaml
        entry: check-yaml
        language: system
        types: [yaml]
      - id: end-of-file-fixer
        name: Fix End of Files
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: '^app/pygeoapi/config_models/(_generated\.py|pygeoapi-config-schema\.yml)$'
        stages: [pre-commit, pre-push, manual]
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: '^app/pygeoapi/config_models/(_generated\.py|pygeoapi-config-schema\.yml)$'
        stages: [pre-commit, pre-push, manual]
      - id: ty
        name: Type check with ty
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.4.1
    hooks:
      # Generated artefacts: reformatting them means `nox -s models`
      # alone leaves a tree CI rejects. The hand-written partial under
      # scripts/ stays formatted — that one is ours.
      #
      # docs/index.md is excluded for a different reason: v2.4.1 reindents
      # the card grid from four spaces to two, which takes the paragraphs
      # out of their list items and breaks the rendering. It does not
      # honour `prettier-ignore-start` in Markdown either, so the file is
      # left alone entirely.
      - id: prettier
        # `frontend/` has its own prettier, run by `npm run format:check`
        # and by the `page` job in CI. This mirror is pinned to v2.4.1,
        # which cannot parse an inline `type` modifier in an import —
        # the form shadcn's components are written in — so leaving it to
        # this hook would mean rewriting every component we copy in.
        exclude: "^(app/pygeoapi/config_models/|frontend/|docs/configuration-reference\\.md$|docs/index\\.md$)"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 2 56 60">
  <style>
    /* Standalone use — a favicon, or an image on a page whose CSS we do
       not supply, such as the README on a dark GitHub. Where a stylesheet
       surrounds the file, these are overridden by it. The export tool
       drops style blocks from saved files, so this one is added here. */
    @media (prefers-color-scheme: dark) {
      :root {
        --fga-ink: #F2F2F2;
        --fga-accent: #7AB51D;
        --fga-surface: #14171A;
        --fga-detail: #7ACBEE;
      }
    }
  </style>
<path fill="var(--fga-ink, #0A0C10)" d="M16 32V20a16 16 0 0 1 32 0v12h-7V20a9 9 0 0 0-18 0v12Z"></path><rect x="6" y="28" width="52" height="32" rx="8" fill="var(--fga-ink, #0A0C10)"></rect><path fill="var(--fga-accent, #479247)" d="M32 33c-5.5 0-9.5 4-9.5 9 0 5 5.5 8 9.5 14 4-6 9.5-9 9.5-14 0-5-4-9-9.5-9Z"></path><circle cx="32" cy="42" r="3.2" fill="var(--fga-surface, #FFFFFF)"></circle></svg>

<!--
  The mark at small sizes.

  The illustration this derives from is a hand-drawn padlock with a
  hatched body, a gear and a map pin. It is right for a header at 2rem
  and unreadable at 32 pixels, where the hatching becomes grey mush —
  measured, not guessed.

  So this keeps the two things that carry the meaning — a padlock, a map
  pin — and drops everything that only survives when large. Two colours,
  four shapes, no strokes thinner than 1/16th of the canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="fastgeoapi">
  <title>fastgeoapi</title>

  <!-- The shackle. Stroked rather than filled so it stays open at the
       bottom, which is what makes the silhouette read as a padlock and
       not as a keyhole. -->
  <path d="M21 28v-7a11 11 0 0 1 22 0v7"
        fill="none" stroke="#0A0C10" stroke-width="6.5" stroke-linecap="round" />

  <!-- The body. Solid, because an outline of this weight closes up at
       16px and the shape turns into a filled rectangle anyway. -->
  <rect x="11" y="27" width="42" height="29" rx="7" fill="#0A0C10" />

  <!-- The pin, in the green sampled from the original artwork. Solid: a
       hole in it would be under a pixel across at favicon size. -->
  <path d="M32 34c-4.3 0-7.8 3.4-7.8 7.6 0 5.5 7.8 12 7.8 12s7.8-6.5 7.8-12c0-4.2-3.5-7.6-7.8-7.6z"
        fill="#479247" />
</svg>

{% extends "_layout.html" %}
{% block content %}
<div class="split{% if not map %} solo{% endif %}">
  <section class="panel">
    <h1>{{ title }}</h1>
    <p class="lead">{{ description }}</p>
    <table class="data">
      <thead><tr><th>{{ _("Title") }}</th><th>{{ _("Tiling scheme") }}</th><th>{{ _("Data type") }}</th></tr></thead>
      <tbody>
      {% for row in rows %}<tr><td><a href="{{ row.href | safe_url }}">{{ row.title }}</a></td><td>{{ row.tms }}</td><td>{{ row.data_type }}</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% include "_map.html" %}
</div>
{% endblock %}

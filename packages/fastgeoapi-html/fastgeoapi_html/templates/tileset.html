{% extends "_layout.html" %}
{% block content %}
<div class="split{% if not map %} solo{% endif %}">
  <section class="panel">
    <h1>{{ title }}</h1>
    <dl class="facts">
      {% for fact in facts %}<dt>{{ fact.label }}</dt><dd>{% if fact.href %}<a href="{{ fact.href }}">{{ fact.value }}</a>{% else %}{{ fact.value }}{% endif %}</dd>
      {% endfor %}
    </dl>
    {% if template %}<h2>{{ _("Tiles") }}</h2>
    <pre><code>{{ template }}</code></pre>{% endif %}
  </section>
  {% include "_map.html" %}
</div>
{% endblock %}

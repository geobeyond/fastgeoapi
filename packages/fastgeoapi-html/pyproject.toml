[project]
name = "fastgeoapi-html"
version = "0.3.0"
description = "The HTML pages of fastgeoapi: templates, message catalogs and compiled assets"
authors = [{ name = "Francesco Bartoli", email = "francesco.bartoli@geobeyond.it" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
classifiers = ["Development Status :: 4 - Beta"]
dependencies = []

[project.urls]
Homepage = "https://github.com/geobeyond/fastgeoapi"
Repository = "https://github.com/geobeyond/fastgeoapi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastgeoapi_html"]
# Vite writes the compiled assets here and git ignores them; the wheel
# carries them all the same.
artifacts = ["fastgeoapi_html/static/**"]

[project]
name = "fastgeoapi-portolan"
version = "0.4.0"
description = "Ingest Portolan catalogs into a fastgeoapi configuration"
authors = [{ name = "Francesco Bartoli", email = "francesco.bartoli@geobeyond.it" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    # The command is written with click: portolan-cli loads only click
    # commands, and since 0.26 typer builds its own. 8.2 is the first click
    # whose CliRunner keeps stderr apart.
    "click>=8.2",
    # With referencing, for the schema validator; the core of the reader imports neither.
    "jsonschema>=4.18",
    "obstore>=0.11",
    "pmtiles>=3.7,<4",
    "referencing>=0.30",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Pydantic models of the catalog documents, besides the TypedDicts of the core.
models = ["pydantic>=2.7"]

# `portolan fastgeoapi ingest`: portolan-cli loads this command when both are
# installed. It is not a dependency, so the pins of portolan-cli stay out of
# the environments of fastgeoapi.
[project.entry-points."portolan.commands"]
fastgeoapi = "fastgeoapi_portolan.plugin:command"

[project.urls]
Homepage = "https://github.com/geobeyond/fastgeoapi"
Repository = "https://github.com/geobeyond/fastgeoapi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastgeoapi_portolan"]

[tool.ruff]
# The rules of fastgeoapi, with the syntax of the oldest Python this package supports.
extend = "../../pyproject.toml"
target-version = "py311"
# Generated by scripts/generate_types.py: restyling them would break the check
# that regenerating reproduces the committed files.
extend-exclude = ["fastgeoapi_portolan/catalog/_generated", "fastgeoapi_portolan/models/[a-z]*.py"]

[tool.ruff.lint.per-file-ignores]
# The exceptions fastgeoapi grants its tests; the paths of the extended
# configuration resolve against the repository root, so they are repeated here.
"tests/*" = ["assert", "hardcoded-bind-all-interfaces", "hardcoded-password-string", "hardcoded-password-func-arg", "hardcoded-temp-file", "hardcoded-sql-expression", "invalid-function-name", "D", "line-too-long"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-m 'not network'"
markers = ["network: reads public data over the internet; run with -m network"]

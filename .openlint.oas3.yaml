# `spectral:oas` is the name OpenLint 1.0.0 knows for its OpenAPI ruleset;
# the `openlint:openapi` of its README comes with a later release.
extends: ["spectral:oas"]
rules:
  no-$ref-siblings: off
  oas3-schema: warn
  oas3-valid-schema-example: off
  oas3-operation-security-defined: off
  operation-tag-defined: off
  oas3-unused-component: off
